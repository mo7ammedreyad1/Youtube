name: Live Streamer - Surah Al-Baqarah (1٤-20)

on:
  workflow_dispatch: # تشغيل البث يدوياً بضغطة زر

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          echo "جاري تثبيت FFmpeg..."
          sudo apt update
          sudo apt install -y ffmpeg
          ffmpeg -version

      - name: Download Video File
        run: |
          echo "جاري تحميل فيديو سورة البقرة (1-20)..."
          curl -L "https://github.com/mo7ammedreyad1/Islam-agent/releases/download/surah-baqarah-1-20-live/quran_baqarah_1_to_20_live.mp4" -o stream_video.mp4
          ls -lh stream_video.mp4

      - name: Start Streaming to Instagram
        run: |
          echo "بدء إرسال البث المباشر إلى إنستغرام..."
          ffmpeg -re -i stream_video.mp4 \
            -c:v copy -c:a copy \
            -f flv "rtmps://edgetee-upload-hbe1-2.xx.fbcdn.net:443/rtmp/18103005710058579?s_bl=1&s_fbp=pmo1-1&s_ow=10&s_prp=hbe1-2&s_sw=0&s_tids=1&s_vt=ig&a=Ab7lUYqsInDW4ttgCTXu1Cze"
          echo "تم الانتهاء من البث بنجاح."
