name: Restream Live Streamer

on:
  workflow_dispatch: # يتيح لك تشغيل البث يدوياً بضغطة زر

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          echo "جاري تثبيت FFmpeg..."
          sudo apt update
          sudo apt install -y ffmpeg
          ffmpeg -version

      - name: Download Video File
        run: |
          echo "جاري تحميل فيديو البث..."
          curl -L "https://github.com/mo7ammedreyad1/Islam-agent/releases/download/fatihah-complete-v1/quran_fatihah_live_broadcast.mp4" -o stream_video.mp4
          ls -lh stream_video.mp4

      - name: Start Streaming to Restream
        env:
          STREAM_URL: ${{ secrets.RESTREAM_STREAM_URL }}
        run: |
          echo "بدء إرسال البث المباشر..."
          ffmpeg -re -i stream_video.mp4 \
            -c:v copy -c:a copy \
            -f flv "${STREAM_URL:-rtmp://live.restream.io/live/re_12341039_event7e655b23c7d24ef0b506f78afc1d63a4}"
          echo "تم الانتهاء من البث بنجاح."
