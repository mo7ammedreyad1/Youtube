name: YouTube Live Streamer

on:
  workflow_dispatch: # يتيح لك تشغيل البث يدوياً بضغطة زر

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          echo "جاري تثبيت FFmpeg..."
          sudo apt update
          sudo apt install -y ffmpeg
          ffmpeg -version

      - name: Download Video File
        run: |
          echo "جاري تحميل فيديو البث..."
          curl -L "https://github.com/mo7ammedreyad1/Islam-agent/releases/download/quran-baqarah-v1/quran_baqarah_rub1_live_broadcast.mp4" -o stream_video.mp4
          ls -lh stream_video.mp4

      - name: Start Streaming to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          echo "بدء إرسال البث المباشر إلى يوتيوب..."
          # تشغيل الفيديو مرتين (الأصل + تكرار مرة واحدة) ثم الإنهاء تلقائياً
          ffmpeg -re -stream_loop 1 -i stream_video.mp4 -c copy -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
          echo "تم الانتهاء من البث بنجاح بعد عرضه مرتين."
