name: New Instagram Live Streamer

on:
  workflow_dispatch: # تشغيل البث يدوياً بضغطة زر

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          echo "جاري تثبيت FFmpeg..."
          sudo apt update
          sudo apt install -y ffmpeg
          ffmpeg -version

      - name: Download New Video File
        run: |
          echo "جاري تحميل فيديو البث الجديد..."
          # ضع رابط الفيديو الجديد بين العلامتين بدلاً من الرابط الحالي إذا أردت تغيير الفيديو
          curl -L "https://github.com/mo7ammedreyad1/Islam-agent/releases/download/fatihah-complete-v1/quran_fatihah_live_broadcast.mp4" -o stream_video.mp4
          ls -lh stream_video.mp4

      - name: Start Streaming to Instagram
        env:
          STREAM_KEY: ${{ secrets.INSTAGRAM_STREAM_KEY }}
        run: |
          echo "بدء إرسال البث المباشر (مرة واحدة فقط بدون تكرار)..."
          # تم إلغاء -stream_loop لضمان إنهاء وقفل البث فور انتهاء الفيديو
          ffmpeg -re -i stream_video.mp4 \
            -c:v copy -c:a copy \
            -f flv "rtmps://edgetee-upload-hbe1-2.xx.fbcdn.net:443/rtmp/$STREAM_KEY"
          
          echo "تم الانتهاء من الفيديو وقفل البث المباشر تلقائياً."
