name: Live Streamer - Surah Al-Baqarah (1-20)

on:
  workflow_dispatch: # تشغيل البث يدوياً بضغطة زر

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Install FFmpeg
        run: |
          echo "جاري تثبيت FFmpeg..."
          sudo apt update
          sudo apt install -y ffmpeg
          ffmpeg -version

      - name: Download Video File
        run: |
          echo "جاري تحميل فيديو سورة البقرة (1-20)..."
          curl -L "https://github.com/mo7ammedreyad1/Islam-agent/releases/download/surah-baqarah-1-20-live/quran_baqarah_1_to_20_live.mp4" -o stream_video.mp4
          ls -lh stream_video.mp4

      - name: Start Streaming to Instagram
        env:
          STREAM_KEY: ${{ secrets.INSTAGRAM_STREAM_KEY1 }}
        run: |
          echo "بدء إرسال البث المباشر (يعرض مرة واحدة وينتهي تلقائياً)..."
          ffmpeg -re -i stream_video.mp4 \
            -c:v copy -c:a copy \
            -f flv "rtmps://edgetee-upload-hbe1-2.xx.fbcdn.net:443/rtmp/$STREAM_KEY"
          echo "تم الانتهاء من البث بنجاح وقفل الرابط."
